name: esselworld_scanner_demo

description: Esselworld QR ticket scanner - online/offline with partial visitor scanning

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.19.0
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  sqflite: ^2.4.1
  path: ^1.9.0
  csv: ^6.0.0
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  file_picker: ^8.1.4
  uuid: ^4.5.1
  device_info_plus: ^11.1.1
  android_id: ^0.4.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/sample_tickets.csv
    - assets/images/backgroundIMG.png
    - assets/images/water_loader.png
    - assets/icon/app_icon.png
    - assets/icon/

# App Launcher Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/app_icon.png"

  min_sdk_android: 21
  remove_alpha_ios: true

